<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/portfolio/">
  <title>Visit stats · Rakesh Kumar</title>
  <link rel="stylesheet" href="demos/assets/demo.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    [data-accent]{--accent:#c96442;--accent-lt:#faeae3;}
    .filters { display:flex; gap:.4rem; flex-wrap:wrap; margin:.8rem 0 1rem; }
    .filters button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
    .bars { display:flex; align-items:flex-end; gap:6px; height:120px; }
    .bars i { flex:1; background:var(--accent); border-radius:4px 4px 0 0; min-height:2px; position:relative; }
    .bars i span { position:absolute; top:-16px; left:50%; transform:translateX(-50%); font-size:.62rem; color:var(--sub); }
    .dwrap { max-width: 1120px; }
    .split2 { display:grid; grid-template-columns:1.3fr .7fr; gap:1rem; }
    tr.pick { cursor:pointer; }
    tr.pick.on { background:var(--accent-lt); }
    .meter { height:8px; background:var(--parchment); border-radius:99px; overflow:hidden; }
    .meter b { display:block; height:100%; background:var(--accent); }
    #map { width:100%; height:min(68vh, 560px); border-radius:12px; background:#d7e4ea; }
    @media(max-width:860px){ .split2{grid-template-columns:1fr;} }
  </style>
</head>
<body data-accent>
<nav class="dnav">
  <a class="brand" href="./">Rakesh<span>·</span>stats</a>
  <div class="links">
    <a href="./">Portfolio</a>
    <a href="demos/">Demos</a>
    <a href="resume.html">Résumé</a>
  </div>
</nav>
<div class="dwrap">
  <div class="dhead">
    <div class="eyebrow">Live visit log</div>
    <h1>Who came, from where, and how far they got</h1>
    <p class="lede" id="status">Loading the visit log…</p>
  </div>
  <div class="filters" id="range">
    <button class="btn btn-sm on" data-d="all">All</button>
    <button class="btn btn-sm" data-d="1">24 hours</button>
    <button class="btn btn-sm" data-d="7">7 days</button>
    <button class="btn btn-sm" data-d="30">30 days</button>
    <input id="q" placeholder="Filter path, city, browser" style="min-width:200px">
    <button class="btn btn-sm" id="liveBtn">Live</button>
  </div>
  <div class="kpis" id="kpis" style="margin-bottom:1rem"></div>
  <div class="card" style="margin-bottom:1rem">
    <div class="spread"><h3>Where</h3><span class="muted" id="mapNote" style="font-size:.8rem"></span></div>
    <div id="map"></div>
  </div>
  <div class="card">
    <h3>Visits by day</h3>
    <div class="bars" id="days"></div>
  </div>
  <div class="split2" style="margin-top:1rem">
    <div class="card">
      <h3>How far down the page</h3>
      <div id="depth"></div>
    </div>
    <div class="card">
      <h3>Pages</h3>
      <div id="pages"></div>
    </div>
  </div>
  <div class="card" style="margin-top:1rem">
    <table class="table">
      <thead><tr>
        <th data-k="t">When</th><th data-k="city">Where</th><th data-k="browser">Browser</th>
        <th data-k="path">Page</th><th data-k="depth">How far</th><th data-k="ms">Time</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty" id="none" hidden>No visits in this filter.</p>
  </div>
  <div class="card" id="detail" style="margin-top:1rem" hidden></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="demos/assets/track.js"></script>
<script>
const API = "https://crudcrud.com/api/cc582e3d13ca4c75aca609dbe9da43cb/visits";
let remote = [];
let days = "all", q = "", sortK = "t", sortD = -1, picked = null, timer = null;
async function refresh() {
  const status = document.getElementById("status");
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    remote = data.map(function (v) { v.uid = v._id; return v; });
    status.textContent = remote.length
      ? "Live log. " + remote.length + " real page view" + (remote.length === 1 ? "" : "s") + " so far. No IP address is stored."
      : "Live log is empty. Open any portfolio page and it will show up here within a few seconds.";
  } catch (e) {
    status.textContent = "The visit log could not be loaded (" + e.message + ").";
  }
  draw();
}
function rows() {
  let list = remote.slice();
  const now = Date.now();
  const win = days === "all" ? Infinity : (+days) * 86400000;
  const query = q.toLowerCase();
  list = list.filter(function (r) {
    if (now - new Date(r.t).getTime() > win) return false;
    if (!query) return true;
    return (r.path + " " + r.city + " " + r.country + " " + r.browser + " " + r.os + " " + r.ref).toLowerCase().indexOf(query) >= 0;
  });
  list.sort(function (a, b) {
    var x = a[sortK], y = b[sortK];
    if (x > y) return sortD; if (x < y) return -sortD; return 0;
  });
  return list;
}
function fmtWhen(iso) {
  var d = new Date(iso);
  return d.toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
}
function fmtMs(ms) {
  var s = Math.round((ms || 0) / 1000);
  if (s < 60) return s + "s";
  return Math.floor(s / 60) + "m " + (s % 60) + "s";
}
function draw() {
  var list = rows();
  var sessions = {};
  list.forEach(function (r) { sessions[r.id] = 1; });
  var avgD = list.length ? Math.round(list.reduce(function (s, r) { return s + (r.depth || 0); }, 0) / list.length) : 0;
  var avgT = list.length ? list.reduce(function (s, r) { return s + (r.ms || 0); }, 0) / list.length : 0;
  var countries = {};
  list.forEach(function (r) { if (r.country) countries[r.country] = 1; });
  document.getElementById("kpis").innerHTML = [
    [list.length, "Page views"],
    [Object.keys(sessions).length, "Visitors"],
    [Object.keys(countries).length, "Countries"],
    [avgD + "%", "Avg scroll"],
    [fmtMs(avgT), "Avg time"]
  ].map(function (k) { return '<div class="kpi"><b>' + k[0] + '</b><span>' + k[1] + '</span></div>'; }).join("");

  var byDay = {};
  list.forEach(function (r) {
    var day = r.t.slice(0, 10);
    byDay[day] = (byDay[day] || 0) + 1;
  });
  var dayKeys = Object.keys(byDay).sort();
  var maxDay = Math.max.apply(null, dayKeys.map(function (d) { return byDay[d]; }).concat([1]));
  document.getElementById("days").innerHTML = dayKeys.map(function (d) {
    return '<i style="height:' + (byDay[d] / maxDay * 100) + '%" title="' + d + ": " + byDay[d] + '"><span>' + byDay[d] + '</span></i>';
  }).join("") || '<p class="muted">No days in this filter.</p>';

  drawMap(list);

  var bands = [0, 0, 0, 0];
  list.forEach(function (r) {
    var d = r.depth || 0;
    bands[d >= 90 ? 3 : d >= 60 ? 2 : d >= 30 ? 1 : 0] += 1;
  });
  var labels = ["Left near the top", "Reached a third", "Reached most of it", "Read to the end"];
  var maxB = Math.max.apply(null, bands.concat([1]));
  document.getElementById("depth").innerHTML = bands.map(function (n, i) {
    return '<div style="margin:.45rem 0"><div class="spread"><span>' + labels[i] + '</span><span class="mono">' + n + '</span></div><div class="meter"><b style="width:' + (n / maxB * 100) + '%"></b></div></div>';
  }).join("");

  var byPath = {};
  list.forEach(function (r) { byPath[r.path] = (byPath[r.path] || 0) + 1; });
  var paths = Object.keys(byPath).sort(function (a, b) { return byPath[b] - byPath[a]; }).slice(0, 8);
  var maxP = Math.max.apply(null, paths.map(function (p) { return byPath[p]; }).concat([1]));
  document.getElementById("pages").innerHTML = paths.map(function (p) {
    return '<div style="margin:.4rem 0"><div class="spread"><span class="mono" style="font-size:.75rem">' + p + '</span><span>' + byPath[p] + '</span></div><div class="meter"><b style="width:' + (byPath[p] / maxP * 100) + '%"></b></div></div>';
  }).join("") || '<p class="muted">No pages.</p>';

  document.getElementById("none").hidden = list.length > 0;
  document.getElementById("rows").innerHTML = list.slice(0, 80).map(function (r) {
    var where = (r.city || "Locating…") + (r.country ? ", " + r.country : "");
    return '<tr class="pick' + (picked === r.uid ? " on" : "") + '" data-uid="' + r.uid + '"><td>' + fmtWhen(r.t) + '</td><td>' + where + '</td><td>' + r.browser + " · " + r.os + '</td><td class="mono">' + r.path + '</td><td>' + (r.depth || 0) + '%</td><td>' + fmtMs(r.ms) + '</td></tr>';
  }).join("");
  var found = list.find(function (r) { return r.uid === picked; });
  var box = document.getElementById("detail");
  if (!found) { box.hidden = true; return; }
  box.hidden = false;
  var pagesInSession = list.filter(function (r) { return r.id === found.id; }).length;
  box.innerHTML = '<h3>' + (found.city || "This visit") + '</h3><div class="grid grid-3" style="margin-top:.6rem">' +
    [["When", fmtWhen(found.t)], ["Page", found.path], ["Referrer", found.ref], ["Browser", found.browser + " on " + found.os],
     ["Screen", found.sw + "×" + found.sh], ["Language", found.lang || "—"], ["Timezone", found.tz || "—"],
     ["Scroll", (found.depth || 0) + "%"], ["Time on page", fmtMs(found.ms)], ["Pages in this visit", pagesInSession],
     ["Place", [found.city, found.region, found.country].filter(Boolean).join(", ") || "Not resolved yet"],
     ["Visitor", found.id || "—"]
    ].map(function (p) { return '<div><div class="muted" style="font-size:.72rem">' + p[0] + '</div><strong>' + p[1] + '</strong></div>'; }).join("") +
    '</div><div style="margin-top:.7rem"><div class="muted">How far</div><div class="meter"><b style="width:' + (found.depth || 0) + '%"></b></div></div>';
}
document.getElementById("range").onclick = function (e) {
  var b = e.target.closest("button[data-d]"); if (!b) return;
  days = b.dataset.d;
  [].forEach.call(e.currentTarget.querySelectorAll("button[data-d]"), function (x) { x.classList.toggle("on", x === b); });
  draw();
};
document.getElementById("q").oninput = function (e) { q = e.target.value; draw(); };
document.querySelector("thead").onclick = function (e) {
  var k = e.target.dataset.k; if (!k) return;
  if (sortK === k) sortD *= -1; else { sortK = k; sortD = k === "t" ? -1 : 1; }
  draw();
};
document.getElementById("rows").onclick = function (e) {
  var tr = e.target.closest("tr"); if (!tr) return;
  picked = tr.dataset.uid; draw();
};
document.getElementById("liveBtn").onclick = function (e) {
  var on = e.target.classList.toggle("on");
  e.target.textContent = on ? "Pause" : "Live";
  clearInterval(timer);
  if (on) timer = setInterval(refresh, 4000);
};
var map, markers, mapKey = "";
function drawMap(list) {
  if (!window.L) {
    document.getElementById("mapNote").textContent = "Map tiles did not load.";
    return;
  }
  if (!map) {
    map = L.map("map", { scrollWheelZoom: true, worldCopyJump: true }).setView([22, 10], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    markers = L.layerGroup().addTo(map);
  }
  markers.clearLayers();
  var pts = [];
  list.forEach(function (r) {
    if (r.lat == null || r.lon == null || r.lat === "" || r.lon === "") return;
    var lat = +r.lat, lon = +r.lon;
    if (!isFinite(lat) || !isFinite(lon)) return;
    var mark = L.circleMarker([lat, lon], {
      radius: picked === r.uid ? 11 : 8,
      color: "#7a3419",
      weight: 2,
      fillColor: "#c96442",
      fillOpacity: 0.92
    });
    mark.bindPopup("<strong>" + (r.city || "Visit") + (r.country ? ", " + r.country : "") + "</strong><br>" + r.path + "<br>" + r.browser + " · " + (r.depth || 0) + "% down");
    mark.on("click", function () { picked = r.uid; draw(); });
    mark.addTo(markers);
    pts.push([lat, lon]);
  });
  document.getElementById("mapNote").textContent = pts.length ? pts.length + " located" : "No coordinates in this filter yet";
  var key = pts.map(function (p) { return p[0].toFixed(2) + "," + p[1].toFixed(2); }).sort().join("|");
  if (key !== mapKey) {
    mapKey = key;
    if (pts.length === 1) map.setView(pts[0], 6);
    else if (pts.length > 1) map.fitBounds(pts, { padding: [36, 36], maxZoom: 5 });
    else map.setView([22, 10], 2);
  }
  setTimeout(function () { map.invalidateSize(); }, 60);
}
document.getElementById("liveBtn").classList.add("on");
document.getElementById("liveBtn").textContent = "Pause";
timer = setInterval(refresh, 4000);
refresh();
</script>
</body>
</html>
