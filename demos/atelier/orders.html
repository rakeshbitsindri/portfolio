<!DOCTYPE html>
<html lang="en"><head>
<base href="/portfolio/demos/atelier/">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier · orders</title>
<link rel="stylesheet" href="site.css">
</head><body>
<main>
  <div class="kicker">Orders</div>
  <h1 style="font-size:2.6rem">What this browser has placed</h1>
  <div id="list" style="margin-top:1rem"></div>
</main>
<script src="site.js"></script>
<script>
A.chrome("orders");
const rows = A.orders();
const saved = A.wished().map((id) => A.product(id)).filter(Boolean);
document.getElementById("list").innerHTML = (rows.length ? rows.map((o) => `
  <article class="card" style="margin-bottom:.7rem">
    <div class="spread"><strong>${o.no}</strong><span>${o.when} · ${o.pay}</span></div>
    <p class="muted">${o.name}, ${o.city} ${o.pin}</p>
    ${(o.lines || []).map((l) => `<div class="spread"><span>${l.name} · ${l.metal} · ${l.size} × ${l.qty}</span><span>${A.inr(l.price * l.qty)}</span></div>`).join("")}
    <p style="font-weight:700;margin-top:.4rem">${A.inr(o.total)}</p>
  </article>`).join("") : `<p class="muted">No orders yet. <a href="shop.html">Start in the collection.</a></p>`)
  + `<h2 style="font-family:Fraunces,serif;margin:1.4rem 0 .6rem">Saved pieces</h2>`
  + (saved.length ? `<div class="grid">${saved.map((p) => `<a class="card" href="piece.html?id=${p.id}"><img class="photo" src="${p.img}" alt=""><strong>${p.name}</strong></a>`).join("")}</div>` : `<p class="muted">Nothing saved. Use Save on a piece page.</p>`);
</script>
<script src="/portfolio/demos/assets/track.js?v=7" defer></script>
</body></html>
