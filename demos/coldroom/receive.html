<!DOCTYPE html><html lang="en"><head>
<base href="/portfolio/demos/coldroom/">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbour · inward</title><link rel="stylesheet" href="site.css"></head><body>
<main style="max-width:640px">
  <img src="cold-pallet.jpg?v=2" alt="A pallet waiting to be booked in" style="width:100%;height:200px;object-fit:cover;border-radius:12px;margin-bottom:.8rem">
  <div class="kicker">Inward</div><h1>Goods receipt</h1>
  <form class="card" id="f">
    <label>Depositor<input name="party" value="Mehta Traders" required></label>
    <label>Commodity<input name="goods" value="Alphonso pulp" required></label>
    <div class="row"><label>Kg<input name="kg" type="number" min="1" value="800" required></label>
      <label>Pallets<input name="pallets" type="number" min="1" value="2" required></label></div>
    <label>Billing<select name="mode"><option value="kg">Per kg / day @ ₹0.45</option><option value="pallet">Per pallet / month @ ₹1,800</option></select></label>
    <label>In date<input name="inn" type="date" required value="2026-11-04"></label>
    <button class="btn">Receive and place</button>
  </form>
  <p id="msg" style="margin-top:.8rem"></p>
</main>
<script src="site.js"></script>
<script>
C.chrome("in");
document.getElementById("f").onsubmit = (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const lots = C.lots();
  const n = 1000 + lots.length + 1;
  const loc = C.nextLoc();
  const kg = +fd.get("kg");
  lots.unshift({ id: "L-" + n, party: fd.get("party").trim(), goods: fd.get("goods").trim(), kg, left: kg, pallets: +fd.get("pallets"), loc, inn: fd.get("inn"), mode: fd.get("mode"), moved: kg });
  C.save(lots);
  C.note("GRN " + ("L-" + n) + " · " + fd.get("goods") + " · " + kg + " kg into " + loc);
  document.getElementById("msg").innerHTML = `Placed in <strong>${loc}</strong> as L-${n}. <a href="stock.html">See stock</a>.`;
};
</script><script src="/portfolio/demos/assets/track.js?v=4" defer></script>
</body></html>
