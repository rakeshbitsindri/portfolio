<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northline · invoice</title><link rel="stylesheet" href="site.css"></head><body>
<main>
  <div class="spread"><div><div class="kicker">Tax invoice</div><h1 id="num"></h1></div>
    <select id="party"></select></div>
  <p class="muted" id="pos" style="margin:.4rem 0 .8rem"></p>
  <div class="card">
    <table><thead><tr><th>Description</th><th>HSN</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">GST%</th><th class="num">Amount</th></tr></thead>
      <tbody id="lines"></tbody></table>
    <div id="totals" style="max-width:280px;margin-left:auto;margin-top:.7rem"></div>
    <div class="spread" style="margin-top:.8rem"><button class="btn" id="add" type="button">Add line</button><button class="btn" id="issue" type="button">Issue to the ledger</button></div>
    <p id="msg" class="muted" style="margin-top:.6rem"></p>
  </div>
</main>
<script src="site.js"></script>
<script>
B.chrome("new");
let lines = [{ desc: "Site build", hsn: "998313", qty: 12, rate: 2500, gst: 18 }, { desc: "Hosting, annual", hsn: "998315", qty: 1, rate: 8000, gst: 18 }];
const sel = document.getElementById("party");
sel.innerHTML = B.parties.map((p, i) => `<option value="${i}">${p.name} · ${p.state}</option>`).join("");
const party = () => B.parties[+sel.value];
const intra = () => party().state === B.home;
function draw() {
  document.getElementById("num").textContent = "NT-" + B.state().seq;
  document.getElementById("pos").textContent = "Place of supply " + party().state + (intra() ? " · intra-state" : " · inter-state");
  document.getElementById("lines").innerHTML = lines.map((l, i) => `<tr>
    <td><input data-i="${i}" data-k="desc" value="${l.desc}"></td>
    <td><input data-i="${i}" data-k="hsn" value="${l.hsn}" style="width:90px"></td>
    <td class="num"><input data-i="${i}" data-k="qty" type="number" value="${l.qty}" style="width:70px"></td>
    <td class="num"><input data-i="${i}" data-k="rate" type="number" value="${l.rate}" style="width:90px"></td>
    <td class="num"><input data-i="${i}" data-k="gst" type="number" value="${l.gst}" style="width:64px"></td>
    <td class="num" data-amt="${i}">${B.inr(l.qty * l.rate)}</td></tr>`).join("");
  paint();
}
function paint() {
  const taxable = lines.reduce((s, l) => s + l.qty * l.rate, 0);
  const tax = lines.reduce((s, l) => s + l.qty * l.rate * l.gst / 100, 0);
  const rows = intra() ? [["Taxable", taxable], ["CGST", tax / 2], ["SGST", tax / 2]] : [["Taxable", taxable], ["IGST", tax]];
  document.getElementById("totals").innerHTML = rows.map((r) => `<div class="spread"><span class="muted">${r[0]}</span><span>${B.inr(r[1])}</span></div>`).join("") + `<div class="spread" style="font-weight:700;margin-top:.3rem"><span>Total</span><span>${B.inr(taxable + tax)}</span></div>`;
}
document.getElementById("lines").addEventListener("input", (e) => {
  const el = e.target; if (!el.dataset.k) return;
  const l = lines[+el.dataset.i];
  l[el.dataset.k] = (el.dataset.k === "desc" || el.dataset.k === "hsn") ? el.value : +el.value;
  document.querySelector(`[data-amt="${el.dataset.i}"]`).textContent = B.inr(l.qty * l.rate);
  paint();
});
sel.onchange = () => { document.getElementById("pos").textContent = "Place of supply " + party().state + (intra() ? " · intra-state" : " · inter-state"); paint(); };
document.getElementById("add").onclick = () => { lines.push({ desc: "", hsn: "", qty: 1, rate: 0, gst: 18 }); draw(); };
document.getElementById("issue").onclick = () => {
  const st = B.state();
  const taxable = lines.reduce((s, l) => s + l.qty * l.rate, 0);
  const tax = lines.reduce((s, l) => s + l.qty * l.rate * l.gst / 100, 0);
  const no = "NT-" + st.seq;
  st.invoices.unshift({ no, party: party().name, total: taxable + tax, kind: intra() ? "CGST+SGST" : "IGST" });
  st.seq += 1; B.save(st);
  document.getElementById("msg").innerHTML = `${no} issued. <a href="ledger.html">Open the ledger</a>.`;
  document.getElementById("num").textContent = "NT-" + st.seq;
};
draw();
</script></body></html>
