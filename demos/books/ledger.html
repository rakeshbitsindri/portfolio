<!DOCTYPE html><html lang="en"><head>
<base href="/portfolio/demos/books/">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northline · ledger</title><link rel="stylesheet" href="site.css"></head><body>
<main>
  <div class="kicker">Ledger</div><h1>What has been issued</h1>
  <div class="card" style="margin-top:1rem" id="list"></div>
</main>
<script src="site.js"></script>
<script>
B.chrome("ledger");
const rows = B.state().invoices;
document.getElementById("list").innerHTML = rows.length ? `<table><thead><tr><th>No</th><th>Date</th><th>Party</th><th>Tax</th><th class="num">Taxable</th><th class="num">Total</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${r.no}</td><td>${r.when || ""}</td><td>${r.party}</td><td>${r.kind}</td><td class="num">${r.taxable != null ? B.inr(r.taxable) : "—"}</td><td class="num">${B.inr(r.total)}</td></tr>`).join("")}</tbody></table>` : `<p class="muted">Nothing issued yet. <a href="invoice.html">Raise one</a>.</p>`;
</script><script src="/portfolio/demos/assets/track.js?v=5" defer></script>
</body></html>
