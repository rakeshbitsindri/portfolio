<!DOCTYPE html><html lang="en"><head>
<base href="/portfolio/demos/books/">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northline Books</title><link rel="stylesheet" href="site.css"></head><body>
<main>
  <img src="books-desk.jpg?v=2" alt="The ledger desk" style="width:100%;height:300px;object-fit:cover;border-radius:14px;margin-bottom:1rem">
  <div class="kicker">Telangana · GSTIN 36AABCU9603R1ZM</div>
  <h1>The books of the firm.</h1>
  <p class="muted" style="max-width:36rem;margin:.7rem 0 1rem">Raise a tax invoice, watch CGST and SGST split when the party is in the state and IGST when they are not, then find it on the ledger.</p>
  <div class="spread" style="max-width:520px">
    <div class="card"><b id="n">0</b><div class="muted">Issued here</div></div>
    <div class="card"><b id="v">₹0</b><div class="muted">Value</div></div>
    <a class="btn" href="invoice.html">New invoice</a>
  </div>
</main>
<script src="site.js"></script>
<script>
B.chrome("home");
const s = B.state();
document.getElementById("n").textContent = s.invoices.length;
document.getElementById("v").textContent = B.inr(s.invoices.reduce((t, i) => t + i.total, 0));
</script><script src="/portfolio/demos/assets/track.js?v=6" defer></script>
</body></html>
