<!DOCTYPE html>
<html lang="en" ng-app="kanbanApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/portfolio/">
  <title>AngularJS · Kanban board</title>
  <link rel="stylesheet" href="demos/assets/demo.css">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <style>
    [data-accent]{--accent:#0e7c86;--accent-lt:#e0f2f3;}
    .cols { display:grid; grid-template-columns:repeat(4,1fr); gap:.8rem; }
    .col { background:var(--parchment); border-radius:12px; padding:.7rem; min-height:260px; }
    .col h3 { font-family:var(--sans); font-size:.82rem; text-transform:uppercase; letter-spacing:.05em; color:var(--sub); display:flex; justify-content:space-between; margin-bottom:.6rem; }
    .ticket { background:#fff; border:1px solid var(--rule); border-radius:10px; padding:.6rem .7rem; margin-bottom:.5rem; cursor:grab; }
    .ticket.drag { opacity:.4; }
    .ticket .mv { display:flex; justify-content:space-between; margin-top:.4rem; }
    .col.over { outline:2px dashed var(--accent); }
    @media(max-width:820px){ .cols{ grid-template-columns:1fr 1fr; } }
    @media(max-width:520px){ .cols{ grid-template-columns:1fr; } .col{ min-height:0; } }
  </style>
</head>
<body data-accent ng-controller="Ctrl">
  <nav class="dnav">
    <a class="brand" href="demos/">Rakesh<span>·</span>demos</a>
    <div class="links"><a href="demos/">All demos</a><a href="./">Portfolio</a><a href="resume.html">Résumé</a></div>
  </nav>
  <div class="dwrap">
    <div class="dhead">
      <div class="eyebrow">AngularJS 1.8 · drag &amp; drop · WIP limits</div>
      <h1>Delivery board</h1>
      <p class="lede">Move work across columns by dragging a card or using the arrows. WIP counts update live; add a card to the backlog.</p>
    </div>
    <div class="toolbar">
      <input ng-model="newTitle" placeholder="New task title" style="flex:1;min-width:180px" ng-keydown="$event.keyCode===13 && add()">
      <select ng-model="newPri"><option>Low</option><option>Med</option><option>High</option></select>
      <button class="btn btn-primary" ng-click="add()">Add to backlog</button>
    </div>
    <div class="cols">
      <div class="col" ng-repeat="c in cols" ng-class="{over: overCol===c}"
           ng-drop="true" on-drop="moveTo(c)" data-col="{{c}}">
        <h3>{{ c }} <span class="tag">{{ count(c) }}</span></h3>
        <div class="ticket" ng-repeat="t in tickets | filter:{col:c}" draggable="true"
             ng-class="{drag: dragging===t}" on-dragstart="start(t)" on-dragend="end()">
          <div class="spread">
            <strong style="font-size:.88rem">{{ t.title }}</strong>
            <span class="pill" ng-class="{High:'bad',Med:'warn',Low:'mut'}[t.pri]">{{ t.pri }}</span>
          </div>
          <div class="mv">
            <button class="btn btn-sm" ng-click="shift(t,-1)" ng-disabled="idx(c)===0">←</button>
            <span class="muted mono" style="font-size:.7rem">#{{ t.id }}</span>
            <button class="btn btn-sm" ng-click="shift(t,1)" ng-disabled="idx(c)===cols.length-1">→</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    angular.module("kanbanApp", [])
      .directive("onDrop", function () {
        return { link: function (s, el, a) {
          el.on("dragover", (e) => { e.preventDefault(); el.addClass("over"); s.$apply(() => s.overCol = s.$eval(el.attr("data-col") ? "'" + el.attr("data-col") + "'" : "null")); });
          el.on("dragleave", () => el.removeClass("over"));
          el.on("drop", (e) => { e.preventDefault(); el.removeClass("over"); s.$apply(() => s.$eval(a.onDrop)); });
        }};
      })
      .directive("onDragstart", function () {
        return { link: function (s, el, a) { el.on("dragstart", () => s.$apply(() => s.$eval(a.onDragstart))); }};
      })
      .directive("onDragend", function () {
        return { link: function (s, el, a) { el.on("dragend", () => s.$apply(() => s.$eval(a.onDragend))); }};
      })
      .controller("Ctrl", function ($scope) {
        $scope.cols = ["Backlog", "In progress", "Review", "Done"];
        let id = 0;
        const mk = (t, c, p) => ({ id: ++id, title: t, col: c, pri: p });
        $scope.tickets = [
          mk("Wireframe the SharePoint hub", "Backlog", "Med"),
          mk("AngularJS form validation", "In progress", "High"),
          mk("Responsive nav + grid", "In progress", "Med"),
          mk("Document library view", "Review", "Low"),
          mk("Theme tokens + dark mode", "Done", "Low")
        ];
        $scope.newPri = "Med";
        $scope.count = (c) => $scope.tickets.filter((t) => t.col === c).length;
        $scope.idx = (c) => $scope.cols.indexOf(c);
        $scope.add = function () {
          if (!$scope.newTitle) return;
          $scope.tickets.push(mk($scope.newTitle, "Backlog", $scope.newPri));
          $scope.newTitle = "";
        };
        $scope.shift = function (t, d) {
          const i = $scope.idx(t.col) + d;
          if (i >= 0 && i < $scope.cols.length) t.col = $scope.cols[i];
        };
        $scope.start = (t) => { $scope.dragging = t; };
        $scope.end = () => { $scope.dragging = null; $scope.overCol = null; };
        $scope.moveTo = function (c) { if ($scope.dragging) $scope.dragging.col = c; $scope.end(); };
      });
  </script>
<script src="/portfolio/demos/assets/track.js?v=6" defer></script>
</body>
</html>
