<!DOCTYPE html>
<html lang="en"><head>
<base href="/portfolio/demos/academy/">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northline · news</title>
<link rel="stylesheet" href="site.css">
</head><body>
<main>
  <div class="kicker">News</div>
  <h1>What the hub is saying</h1>
  <div id="list" style="margin-top:1rem"></div>
</main>
<script src="site.js"></script>
<script>
H.chrome("news");
document.getElementById("list").innerHTML = H.state().news.map((n) => `<article class="card" style="margin-bottom:.6rem"><div class="muted">${n.day}</div><strong>${n.title}</strong><p>${n.body}</p></article>`).join("");
</script>
<script src="/portfolio/demos/assets/track.js?v=6" defer></script>
</body></html>
