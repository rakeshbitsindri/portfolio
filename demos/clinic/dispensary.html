<!DOCTYPE html>
<html lang="en"><head>
<base href="/portfolio/demos/clinic/">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prakriti · dispensary</title>
<link rel="stylesheet" href="site.css">
</head><body>
<main>
  <div class="kicker">Dispensary</div>
  <h1>Bottles on the shelf</h1>
  <p class="muted">Saving a visit whose remedy starts with one of these names takes a bottle off the shelf.</p>
  <div class="card" style="margin-top:1rem" id="rows"></div>
  <form class="card" id="f" style="margin-top:1rem;max-width:420px">
    <label>Add a remedy<input name="name" required placeholder="Rhus tox 30"></label>
    <label>Bottles<input name="n" type="number" min="1" value="6"></label>
    <button class="btn">Stock it</button>
  </form>
</main>
<script src="site.js"></script>
<script>
K.chrome("rx");
function draw() {
  document.getElementById("rows").innerHTML = K.state().stock.map((b) => `<div class="spread" style="padding:.45rem 0;border-bottom:1px solid var(--line)"><strong>${b.name}</strong><span>${b.bottles} left</span></div>`).join("");
}
document.getElementById("f").onsubmit = (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const st = K.state();
  st.stock.push({ name: fd.get("name").trim(), bottles: +fd.get("n") });
  K.save(st); e.target.reset(); draw();
};
draw();
</script>
<script src="/portfolio/demos/assets/track.js?v=7" defer></script>
</body></html>
